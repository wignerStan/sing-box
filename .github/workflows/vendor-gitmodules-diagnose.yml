name: Diagnose projected gitmodules data
on:
  push:
    branches: [ci/diagnose-vendor-gitmodules]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Generate and inspect
        env:
          TAGS: with_dae,with_gvisor,with_tailscale
        run: |
          set -euxo pipefail
          python3 tools/vendor/materialize.py --keep-work
          find vendor -name .gitmodules -print -exec sh -c 'echo --- $1; sed -n "1,160p" "$1"' _ {} \;
          find vendor -name .gitmodules -delete
          rm -rf .vendor-work
          go test -run '^$' -tags "$TAGS" ./protocol/dae ./protocol/tailscale ./protocol/tun
          CGO_ENABLED=0 go build -trimpath -tags "$TAGS" ./cmd/sing-box
          grep -RFn '.gitmodules' vendor/modules.txt vendor --exclude=.gitmodules | head -50 || true
