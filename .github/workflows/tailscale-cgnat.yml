name: Native Tailscale CGNAT
on:
  push:
    branches: [fix/tailscale-cgnat-direct-udp, integration/tailscale-system-interface]
    paths: ['protocol/tailscale/**', 'protocol/tun/**', 'go.mod', 'go.sum', '.github/workflows/tailscale-cgnat.yml']
  pull_request:
    branches: [integration/tailscale-system-interface]
    paths: ['protocol/tailscale/**', 'protocol/tun/**', 'go.mod', 'go.sum', '.github/workflows/tailscale-cgnat.yml']
permissions:
  contents: read
concurrency:
  group: tailscale-cgnat-${{ github.ref }}
  cancel-in-progress: true
env:
  BUILD_TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Race and lifecycle regression tests
        run: |
          go test -mod=readonly -race -tags "$BUILD_TAGS" -count=1 ./protocol/tailscale ./protocol/tun
          go vet -mod=readonly -tags "$BUILD_TAGS" ./protocol/tailscale ./protocol/tun
      - name: Build exact-source native binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          mkdir artifacts
          revision=$(git rev-parse --short=12 HEAD)
          os=${TARGET%-*}
          arch=${TARGET#*-}
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -mod=readonly -tags "$BUILD_TAGS" -trimpath -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=1.14.0-cgnat-$revision" -o "artifacts/sing-box-$TARGET" ./cmd/sing-box
          chmod +x "artifacts/sing-box-$TARGET"
          "artifacts/sing-box-$TARGET" version
          git rev-parse HEAD > artifacts/SOURCE_COMMIT
          go list -m -json github.com/sagernet/tailscale > artifacts/TAILSCALE_DEPENDENCY.json
          git diff --exit-code -- go.mod go.sum
          git archive HEAD | gzip > artifacts/source.tar.gz
          (cd artifacts && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-cgnat-${{ matrix.target }}
          path: artifacts/
          retention-days: 30
