name: Diagnose vendor portability
on:
  push:
    branches: [ci/diagnose-vendor-portability]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Compare checked-in and regenerated trees
        shell: bash
        run: |
          set -euxo pipefail
          cp -a vendor "$RUNNER_TEMP/vendor-checked"
          python3 tools/vendor/materialize.py
          python3 - "$RUNNER_TEMP/vendor-checked/tailscale" vendor/tailscale <<'PY'
          import hashlib, json, os, stat, sys
          from pathlib import Path

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def records(root):
              root = Path(root)
              out = {}
              for path in sorted(root.rglob('*'), key=lambda p: p.relative_to(root).as_posix()):
                  rel = path.relative_to(root).as_posix()
                  info = path.lstat()
                  mode = f"{stat.S_IMODE(info.st_mode):04o}"
                  if path.is_symlink():
                      target = os.readlink(path)
                      out[rel] = ('symlink', mode, len(target.encode()), hashlib.sha256(target.encode()).hexdigest())
                  elif path.is_dir():
                      out[rel] = ('directory', mode, 0, None)
                  elif path.is_file():
                      out[rel] = ('file', mode, info.st_size, sha(path))
                  else:
                      out[rel] = ('unsupported', mode, info.st_size, None)
              return out

          before, after = records(sys.argv[1]), records(sys.argv[2])
          keys = sorted(set(before) | set(after))
          differences = [(key, before.get(key), after.get(key)) for key in keys if before.get(key) != after.get(key)]
          print(json.dumps({'before_entries': len(before), 'after_entries': len(after), 'difference_count': len(differences)}, sort_keys=True))
          for key, old, new in differences[:300]:
              print(json.dumps({'path': key, 'checked': old, 'regenerated': new}, sort_keys=True))
          if not differences:
              raise SystemExit('no record-level difference found')
          PY
