name: Diagnose vendor portability
on:
  push:
    branches: [ci/diagnose-vendor-portability]
permissions:
  contents: read
jobs:
  records:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Record checked-in vendor tree
        env:
          PLATFORM_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/records-${PLATFORM_NAME}.json" <<'PY'
          import hashlib, json, os, stat, sys
          from pathlib import Path

          def sha(path):
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def records(root):
              root = Path(root)
              result = {}
              for path in sorted(root.rglob('*'), key=lambda item: item.relative_to(root).as_posix()):
                  relative = path.relative_to(root).as_posix()
                  info = path.lstat()
                  mode = f"{stat.S_IMODE(info.st_mode):04o}"
                  if path.is_symlink():
                      target = os.readlink(path)
                      result[relative] = {
                          'kind': 'symlink', 'mode': mode,
                          'size': len(target.encode('utf-8')),
                          'sha256': hashlib.sha256(target.encode('utf-8')).hexdigest(),
                      }
                  elif path.is_dir():
                      result[relative] = {'kind': 'directory', 'mode': mode, 'size': 0, 'sha256': None}
                  elif path.is_file():
                      result[relative] = {'kind': 'file', 'mode': mode, 'size': info.st_size, 'sha256': sha(path)}
                  else:
                      raise SystemExit(f'unsupported path: {path}')
              return result

          payload = {
              'dae': records('vendor/dae/ebpfinbound'),
              'tailscale': records('vendor/tailscale'),
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, sort_keys=True), encoding='utf-8')
          print(json.dumps({name: len(entries) for name, entries in payload.items()}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-records-${{ matrix.name }}
          path: ${{ runner.temp }}/records-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

  compare:
    needs: records
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vendor-records-*
          path: records
          merge-multiple: true
      - name: Compare Linux and macOS records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          linux = json.loads(Path('records/records-linux.json').read_text())
          macos = json.loads(Path('records/records-macos.json').read_text())
          total = 0
          for component in sorted(set(linux) | set(macos)):
              left = linux.get(component, {})
              right = macos.get(component, {})
              differences = []
              for path in sorted(set(left) | set(right)):
                  if left.get(path) != right.get(path):
                      differences.append({'path': path, 'linux': left.get(path), 'macos': right.get(path)})
              total += len(differences)
              print(json.dumps({
                  'component': component,
                  'linux_entries': len(left),
                  'macos_entries': len(right),
                  'difference_count': len(differences),
              }, sort_keys=True))
              for difference in differences[:400]:
                  print(json.dumps(difference, sort_keys=True))
          if total == 0:
              raise SystemExit('vendor records are identical; investigate lock-generation context')
          PY
