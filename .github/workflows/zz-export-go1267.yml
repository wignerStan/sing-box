name: Export Go 1.26.7 toolchain

on:
  push:
    branches:
      - tmp-export-go1267

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Archive Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          goroot=$(go env GOROOT)
          tar -C "$(dirname "$goroot")" -czf /tmp/go1.26.7-linux-amd64.tar.gz "$(basename "$goroot")"
          sha256sum /tmp/go1.26.7-linux-amd64.tar.gz > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: go1.26.7-linux-amd64
          path: |
            /tmp/go1.26.7-linux-amd64.tar.gz
            /tmp/SHA256SUMS
          retention-days: 1
