name: Vendor-authoritative release
on:
  push:
    branches: [release/v1.14.2-wigner.1]
permissions:
  contents: write
env:
  RELEASE_TAG: v1.14.2-wigner.1
  PRODUCT_TAGS: with_dae,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale
jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify tracked release source and build
        env:
          TARGET: ${{ matrix.target }}
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
        run: |
          set -euxo pipefail
          python3 tools/vendor/verify.py
          go test -mod=vendor -race -tags "$PRODUCT_TAGS" -count=1 ./common/tls ./protocol/dae ./protocol/tailscale ./protocol/tun
          go vet -mod=vendor -tags "$PRODUCT_TAGS" ./common/tls ./protocol/dae ./protocol/tailscale ./protocol/tun
          os=${TARGET%-*}
          arch=${TARGET#*-}
          version=${RELEASE_TAG#v}
          package="$RUNNER_TEMP/package"
          mkdir -p "$package"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -mod=vendor -trimpath -buildvcs=false -tags "$PRODUCT_TAGS" -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=$version" -o "$package/sing-box" ./cmd/sing-box
          chmod +x "$package/sing-box"
          "$package/sing-box" version
          git rev-parse HEAD > "$package/SOURCE_COMMIT"
          cp deps/vendor-lock.json "$package/VENDOR_LOCK.json"
          (cd "$package" && shasum -a 256 sing-box SOURCE_COMMIT VENDOR_LOCK.json > SHA256SUMS)
          tar -C "$package" -czf "$RUNNER_TEMP/sing-box-${RELEASE_TAG}-${TARGET}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: ${{ runner.temp }}/sing-box-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify and archive tracked release source
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
        run: |
          set -euxo pipefail
          python3 tools/vendor/verify.py
          prefix="sing-box-${RELEASE_TAG}/"
          git archive --format=tar --prefix="$prefix" HEAD | gzip -n > "sing-box-${RELEASE_TAG}-source.tar.gz"
          sha256sum "sing-box-${RELEASE_TAG}-source.tar.gz" > "sing-box-${RELEASE_TAG}-source.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ env.RELEASE_TAG }}-source
          path: |
            sing-box-${{ env.RELEASE_TAG }}-source.tar.gz
            sing-box-${{ env.RELEASE_TAG }}-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [product, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          find release-assets -maxdepth 1 -type f -print -exec sha256sum {} \; | sort
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG"
