name: Migrate Go vendor projection
on:
  push:
    branches: [integration/vendor-authority]
    paths:
      - '.github/workflows/vendor-projection-migrate.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: integration/vendor-authority
          fetch-depth: 0
      - name: Initialize pristine inputs
        run: git submodule update --init --depth=1 third_party/dae third_party/tailscale
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Generate standard Go vendor projection
        run: |
          set -euxo pipefail
          python3 -m unittest discover -s tools/vendor -p 'test_*.py' -v
          python3 tools/vendor/materialize.py --keep-work
          test -f vendor/modules.txt
          test -d vendor/github.com/daeuniverse/dae/ebpfinbound
          test -d vendor/github.com/sagernet/tailscale
          python3 tools/vendor/verify.py --require-source
      - name: Smoke dependency and product graphs
        env:
          PRODUCT_TAGS: with_dae,with_gvisor,with_tailscale
        run: |
          set -euxo pipefail
          (cd .vendor-work/dae/ebpfinbound && go test -run '^$' ./...)
          (cd .vendor-work/tailscale && go test -run '^$' ./tsnet ./net/netmon ./util/linuxfw)
          rm -rf .vendor-work
          go test -run '^$' -tags "$PRODUCT_TAGS" ./protocol/dae ./protocol/tailscale ./protocol/tun
          CGO_ENABLED=0 go build -trimpath -tags "$PRODUCT_TAGS" ./cmd/sing-box
          git diff --check
      - name: Publish generated projection
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A vendor deps/vendor-lock.json go.mod go.sum
          git commit -s -m 'build(vendor): project patched modules through Go vendoring'
          git push origin HEAD:integration/vendor-authority
