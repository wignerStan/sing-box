name: Inspect patch vendor migration
on:
  push:
    branches: [integration/patch-vendor-authority]
    paths: [.github/workflows/migrate-patch-vendor.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: integration/patch-vendor-authority
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect reviewed native Tailscale merge
        run: |
          set -euxo pipefail
          git config user.name 'migration-check'
          git config user.email 'migration-check@example.invalid'
          git fetch origin fix/tailscale-cgnat-direct-udp
          if ! git merge --no-ff --no-commit origin/fix/tailscale-cgnat-direct-udp; then
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check --cached
          git status --short
