name: Export dae hardening source

on:
  push:
    branches:
      - tmp/export-dae-hardening-source-20260831

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/export-dae-hardening-source-20260831
          fetch-depth: 0
      - name: Archive source
        run: |
          git archive --format=tar.gz --output=/tmp/sing-box-hardening-latest.tar.gz HEAD
          sha256sum /tmp/sing-box-hardening-latest.tar.gz > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-hardening-latest-source
          path: |
            /tmp/sing-box-hardening-latest.tar.gz
            /tmp/SHA256SUMS
          retention-days: 2
